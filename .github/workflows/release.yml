# Builds the Warden installers and publishes them as a GitHub release.
# Runs when a version tag (v0.1.0, v0.2.0, ...) is pushed, or on demand.
# The tag must match the version in app/src-tauri/tauri.conf.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon and Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      # macOS: sign with the project's self-signed certificate. It does not
      # satisfy Gatekeeper, but it gives every release the same identity, so
      # the Keychain's "Always Allow" survives updates. Without the secrets
      # the build falls back to an ad-hoc signature.
      - name: Set up code signing (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing certificate configured; building with an ad-hoc signature."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/warden-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Trust it for code signing on this throwaway machine, in case codesign insists.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain app/src-tauri/signing/warden-codesign.crt || true
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/Warden Self-Signed/ { print $2; exit }')"
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Both systems still warn on first launch; the README explains how to open the app.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages so installed copies will accept them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Warden v__VERSION__
          releaseBody: |
            **Mac:** download the `.dmg`, open it and drag Warden to Applications.
            **Windows:** download the `-setup.exe` and run it.

            These builds are not code-signed, so your system will warn the first time you open Warden. See "Install" in the README for how to get past that.

            Warden needs `git` and the Claude Code CLI (signed in) on the same machine.
          # Publish latest.json, which installed copies read to find updates.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false

      - name: Show the app's signing identity (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="$(find target -path '*bundle/macos/Warden.app' -maxdepth 6 | head -1)"
          codesign -d -r- "$APP" 2>&1 | grep designated
          codesign --verify --deep --strict "$APP"
