[package]
name = "prr"
version = "0.1.0"
edition = "2021"
description = "AI-assisted PR review CLI for Azure DevOps"

[workspace]
members = [".", "app/src-tauri"]
resolver = "2"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
ratatui = "0.29"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync"] }
toml = "0.8"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
